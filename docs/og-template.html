<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#12151c;font-family:Geist,system-ui,sans-serif;color:#e8eaf0;position:relative;overflow:hidden}
.glow{position:absolute;right:-180px;top:-220px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(54,123,240,.22),transparent 65%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(135deg,transparent 30%,#000 100%)}
.bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:#367bf0}
.wrap{position:absolute;left:96px;right:96px;top:0;bottom:0;display:flex;align-items:center;gap:64px}
.photo{width:240px;height:240px;border-radius:50%;object-fit:cover;object-position:top;border:4px solid #367bf0;flex-shrink:0;box-shadow:0 0 0 10px rgba(54,123,240,.14)}
.mono{font-family:'JetBrains Mono',monospace}
.prompt{font-size:22px;color:#8b93a4;margin-bottom:20px}
.prompt b{color:#3fb950;font-weight:500}
h1{font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05}
.role{font-size:30px;color:#a4abb9;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:12px;margin-top:34px;padding:12px 22px;border-radius:999px;background:rgba(54,123,240,.14);border:1px solid rgba(54,123,240,.4);font-size:26px;color:#6b9ff5;font-weight:500}
.dot{width:12px;height:12px;border-radius:50%;background:#3fb950}
.url{position:absolute;left:96px;bottom:48px;font-size:24px;color:#8b93a4}
